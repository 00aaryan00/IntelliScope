services:
  # 1. FastAPI Web Server & Celery (Combined to save money/free tier)
  - type: web
    name: intelliscope-api
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: bash -c "cd backend; celery -A worker.celery_app worker --loglevel=info & celery -A worker.celery_app beat --loglevel=info & uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: PYTHONPATH
        value: .
